name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, property, API and component tests (with coverage gates)
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle budgets and client secret scan
        run: npm run check:bundle
      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      # The CLI scans the whole history; gitleaks-action fails on a repository's first push
      # (it scans `<root>^..HEAD`, and the root commit has no parent).
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
