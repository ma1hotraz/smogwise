name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dead code (unused files, exports, dependencies)
        run: npm run lint:dead
      - name: Duplication (jscpd, zero clones allowed)
        run: npm run lint:dupes
      - name: Format
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, property, API and component tests (with coverage gates)
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle budgets and client secret scan
        run: npm run check:bundle
      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      # The CLI scans the whole history; gitleaks-action fails on a repository's first push
      # (it scans `<root>^..HEAD`, and the root commit has no parent).
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.24.3
          # sha256 of gitleaks_8.24.3_linux_x64.tar.gz from the release's checksums file.
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
